{% extends "base.html" %}

{% block title %}Login - Data Leak Detection System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-4">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-lg border-primary">
            <div class="card-header text-center py-4">
                <i class="fa-solid fa-user-lock text-primary fs-1 mb-2"></i>
                <h4 class="card-title text-white mb-0">System Sign In</h4>
                <p class="text-secondary small mb-0 mt-1">Authenticate to access protected resources</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small text-uppercase fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small text-uppercase fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                        </button>
                    </div>

                    <div class="text-center text-secondary small mt-3">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-dark text-secondary small py-3">
                <i class="fa-solid fa-shield-halved text-success me-1"></i> Protected by Rate-Limiting & CSRF Defense
            </div>
        </div>
    </div>
</div>
{% endblock %}
